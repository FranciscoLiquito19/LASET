# Verificação automática em cada push e pull request:
#  - compila o relatório (TeX Live completo) e guarda o PDF como artefacto;
#  - verifica as ligações do esquema (hardware/gerador/verificar.py) e corre o ERC do KiCad 9.
# O ERC ainda não bloqueia o merge (continue-on-error): o relatório fica nos artefactos.
# Quando o primeiro ERC estiver limpo, retirar o continue-on-error.
name: CI

on:
  push:
  pull_request:

jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar o relatório
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Modelo_LaSET.tex
          working_directory: template_laset
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Procurar referências por resolver
        working-directory: template_laset
        run: |
          if grep -E "Reference .* undefined|Citation .* undefined" Modelo_LaSET.log; then
            echo "Há referências ou citações por resolver"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: relatorio
          path: template_laset/Modelo_LaSET.pdf

  hardware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar o KiCad 9
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
      - name: Verificar ligações (netlist)
        run: python3 -I hardware/gerador/verificar.py
      - name: ERC do KiCad
        continue-on-error: true
        run: |
          kicad-cli sch erc --format report --severity-error --exit-code-violations \
            -o erc.rpt hardware/laset_gateway.kicad_sch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erc
          path: erc.rpt
