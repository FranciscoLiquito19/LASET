# Verificação automática em cada push e pull request:
#  - compila o relatório (TeX Live completo) e guarda o PDF como artefacto;
#  - verifica as ligações do esquema (hardware/gerador/verificar.py) e corre o ERC do KiCad 9;
#  - compila o firmware para a NUCLEO e para a PCB e corre os testes no PC.
# O ERC ainda não bloqueia o merge (continue-on-error): o relatório fica nos artefactos.
# Quando o primeiro ERC estiver limpo, retirar o continue-on-error.
name: CI

on:
  push:
  pull_request:

jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar o relatório
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Modelo_LaSET.tex
          working_directory: template_laset
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Procurar referências por resolver
        working-directory: template_laset
        run: |
          if grep -E "Reference .* undefined|Citation .* undefined" Modelo_LaSET.log; then
            echo "Há referências ou citações por resolver"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: relatorio
          path: template_laset/Modelo_LaSET.pdf

  hardware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar o KiCad 9
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
      - name: Verificar ligações (netlist)
        run: python3 -I hardware/gerador/verificar.py
      - name: ERC do KiCad
        continue-on-error: true
        run: |
          kicad-cli sch erc --format report --severity-error --exit-code-violations \
            -o erc.rpt hardware/laset_gateway.kicad_sch
      - name: Mostrar o relatório do ERC
        if: always()
        run: cat erc.rpt || true
      - name: DRC da placa e paridade com o esquema
        if: always()
        continue-on-error: true
        run: |
          kicad-cli pcb drc --schematic-parity --format report -o drc.rpt hardware/laset_gateway.kicad_pcb
          echo "Violações por tipo (unconnected_items = ligações por encaminhar):"
          grep -o '^\[[a-z_]*\]' drc.rpt | sort | uniq -c | sort -rn
          grep -A4 -E '^\[(clearance|courtyards_overlap|shorting_items|hole_clearance|copper_edge_clearance|duplicate_footprints|missing_footprint|extra_footprint|net_conflict|footprint_symbol_mismatch|footprint_filters_mismatch)\]' drc.rpt | head -80 || true
          tail -8 drc.rpt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erc
          path: |
            erc.rpt
            drc.rpt

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar o compilador ARM
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Testes no PC
        working-directory: firmware/testes
        run: |
          cmake -B build && cmake --build build && ./build/teste_modulos && ./build/teste_robustez
          python3 ../ferramentas/laset_pc.py autoteste
          python3 -I pinos.py
      - name: Compilar para a NUCLEO-H753ZI
        working-directory: firmware
        run: |
          cmake -B build-nucleo -DPLACA=NUCLEO -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake
          cmake --build build-nucleo
      - name: Compilar para a PCB
        working-directory: firmware
        run: |
          cmake -B build-laset -DPLACA=LASET -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake
          cmake --build build-laset
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/build-nucleo/laset_gateway.elf
            firmware/build-nucleo/laset_gateway.bin
            firmware/build-laset/laset_gateway.elf
